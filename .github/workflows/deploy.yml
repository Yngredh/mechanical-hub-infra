name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente alvo
        required: true
        default: production
        type: choice
        options: [production, staging]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.7.5
  TF_DIR: infra
  TF_STATE_KEY: mechanical-hub-infra/terraform.tfstate

jobs:
  deploy:
    name: Provisionar infraestrutura base
    runs-on: ubuntu-latest

    outputs:
      vpc-id: ${{ steps.tf-outputs.outputs.vpc_id }}
      vpc-cidr: ${{ steps.tf-outputs.outputs.vpc_cidr }}
      private-subnet-ids: ${{ steps.tf-outputs.outputs.private_subnet_ids }}
      private-subnet-cidrs: ${{ steps.tf-outputs.outputs.private_subnet_cidrs }}
      public-subnet-ids: ${{ steps.tf-outputs.outputs.public_subnet_ids }}
      eks-cluster-name: ${{ steps.tf-outputs.outputs.eks_cluster_name }}
      eks-cluster-endpoint: ${{ steps.tf-outputs.outputs.eks_cluster_endpoint }}
      eks-cluster-security-group-id: ${{ steps.tf-outputs.outputs.eks_cluster_security_group_id }}
      ecr-repository-url: ${{ steps.tf-outputs.outputs.ecr_repository_url }}
      otlp-grpc-endpoint: ${{ steps.tf-outputs.outputs.otlp_grpc_endpoint }}
      otlp-http-endpoint: ${{ steps.tf-outputs.outputs.otlp_http_endpoint }}

    steps:
      - uses: actions/checkout@v4

      - name: Conferir secret do Grafana
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          if [ -z "${GRAFANA_ADMIN_PASSWORD}" ]; then
            echo "::error::Secret GRAFANA_ADMIN_PASSWORD ausente. Cadastre-o no repositorio (minimo 12 caracteres) ou defina observability_enabled = false."
            exit 1
          fi
          if [ ${#GRAFANA_ADMIN_PASSWORD} -lt 12 ]; then
            echo "::error::GRAFANA_ADMIN_PASSWORD precisa ter ao menos 12 caracteres."
            exit 1
          fi

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Definir variaveis de state
        id: state
        run: |
          BUCKET="mechanical-hub-tfstate-${{ secrets.AWS_ACCOUNT_ID }}"
          echo "bucket=${BUCKET}" >> $GITHUB_OUTPUT
          echo "environment=${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_OUTPUT

      - name: Garantir bucket de state
        run: |
          aws s3api create-bucket \
            --bucket ${{ steps.state.outputs.bucket }} \
            --region ${{ env.AWS_REGION }} || true

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ steps.state.outputs.bucket }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_environment: ${{ steps.state.outputs.environment }}
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Publicar outputs do contrato
        id: tf-outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          # Escalares via -raw; listas via -json, para nao quebrar em virgulas.
          for o in vpc_id vpc_cidr eks_cluster_name eks_cluster_endpoint \
                   eks_cluster_security_group_id ecr_repository_url; do
            echo "${o}=$(terraform output -raw ${o})" >> $GITHUB_OUTPUT
          done
          for o in private_subnet_ids private_subnet_cidrs public_subnet_ids; do
            echo "${o}=$(terraform output -json ${o} | jq -c .)" >> $GITHUB_OUTPUT
          done
          # Os endpoints de telemetria sao nulos quando a observabilidade esta
          # desligada — `output -raw` falharia nesse caso, entao passa por jq.
          for o in otlp_grpc_endpoint otlp_http_endpoint; do
            echo "${o}=$(terraform output -json ${o} | jq -r '. // ""')" >> $GITHUB_OUTPUT
          done

      - name: Resumo
        working-directory: ${{ env.TF_DIR }}
        run: |
          {
            echo "### Infraestrutura base provisionada"
            echo ""
            echo "| Output | Valor |"
            echo "| --- | --- |"
            echo "| vpc_id | \`$(terraform output -raw vpc_id)\` |"
            echo "| vpc_cidr | \`$(terraform output -raw vpc_cidr)\` |"
            echo "| private_subnet_ids | \`$(terraform output -json private_subnet_ids | jq -c .)\` |"
            echo "| private_subnet_cidrs | \`$(terraform output -json private_subnet_cidrs | jq -c .)\` |"
            echo "| public_subnet_ids | \`$(terraform output -json public_subnet_ids | jq -c .)\` |"
            echo "| eks_cluster_name | \`$(terraform output -raw eks_cluster_name)\` |"
            echo "| eks_cluster_endpoint | \`$(terraform output -raw eks_cluster_endpoint)\` |"
            echo "| eks_cluster_security_group_id | \`$(terraform output -raw eks_cluster_security_group_id)\` |"
            echo "| ecr_repository_url | \`$(terraform output -raw ecr_repository_url)\` |"
            echo ""
            echo "State: \`s3://${{ steps.state.outputs.bucket }}/${{ env.TF_STATE_KEY }}\`"
            echo ""
            echo "Consumidores (ADR-0004): \`mechanical-hub-database\`, \`mechanical-hub-auth\` e o pipeline de deploy de \`mechanical-hub\`."
          } >> $GITHUB_STEP_SUMMARY

          NS=$(terraform output -json observability_namespace | jq -r '. // ""')
          if [ -n "$NS" ]; then
            {
              echo ""
              echo "### Observabilidade (RFC-0004)"
              echo ""
              echo "| Output | Valor |"
              echo "| --- | --- |"
              echo "| observability_namespace | \`${NS}\` |"
              echo "| otlp_grpc_endpoint | \`$(terraform output -json otlp_grpc_endpoint | jq -r '. // ""')\` |"
              echo "| otlp_http_endpoint | \`$(terraform output -json otlp_http_endpoint | jq -r '. // ""')\` |"
              echo ""
              echo "Abrir o Grafana (usuario \`admin\`):"
              echo ""
              echo "\`\`\`bash"
              echo "$(terraform output -json grafana_port_forward_command | jq -r '. // ""')"
              echo "\`\`\`"
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> Observabilidade desligada neste apply (\`observability_enabled = false\`)." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Aguardar a stack de observabilidade
        if: success()
        working-directory: ${{ env.TF_DIR }}
        run: |
          NS=$(terraform output -json observability_namespace | jq -r '. // ""')
          if [ -z "$NS" ]; then
            echo "Observabilidade desligada — nada a verificar."; exit 0
          fi

          aws eks update-kubeconfig \
            --name "$(terraform output -raw eks_cluster_name)" \
            --region "${{ env.AWS_REGION }}"

          # `helm_release` retorna assim que os objetos sao criados, nao quando
          # os pods estao prontos. Sem esta espera, um pod em Pending por falta
          # de espaco no node passaria despercebido ate alguem abrir o Grafana.
          falhou=0
          for d in kube-prometheus-stack-grafana \
                   kube-prometheus-stack-kube-state-metrics \
                   otel-collector-opentelemetry-collector; do
            kubectl -n "$NS" rollout status "deployment/$d" --timeout=5m || falhou=1
          done
          for s in prometheus-kube-prometheus-stack-prometheus loki tempo; do
            kubectl -n "$NS" rollout status "statefulset/$s" --timeout=5m || falhou=1
          done

          if [ "$falhou" -ne 0 ]; then
            echo "::warning::Nem todos os componentes de observabilidade ficaram prontos. Diagnostico abaixo."
            kubectl -n "$NS" get pods -o wide
            kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -30
            echo "::error::Stack de observabilidade incompleta — causa mais comum e falta de CPU/memoria nos nodes (ver eks_node_desired_size)."
            exit 1
          fi

          kubectl -n "$NS" get pods