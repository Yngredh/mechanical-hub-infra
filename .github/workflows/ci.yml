name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.7.5
  TF_DIR: infra

jobs:
  validate:
    name: Terraform fmt e validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init (backend local — sem AWS)
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

  test:
    name: Testes unitarios
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # -test-directory e obrigatorio: o terraform test so procura arquivos em
      # tests/, nao em subpastas. Sem ele, os -filter=tests/unit/... nao
      # encontravam nada e o job passava com 0 testes executados.
      - name: Terraform init (backend local — sem AWS)
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend=false -input=false -test-directory=tests/unit

      # Roda todos os arquivos de tests/unit (vpc, ecr, eks, sqs, app-lb,
      # observabilidade e o modulo raiz) — arquivo novo entra sem mexer aqui.
      # Os de tests/integration ficam de fora: dependem de LocalStack.
      # O grep final barra o "0 passed" silencioso que existia antes.
      - name: Terraform test
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          terraform test -verbose -no-color -test-directory=tests/unit | tee /tmp/test.log
          grep -Eq '^Success! [1-9][0-9]* passed, 0 failed' /tmp/test.log \
            || { echo "::error::Nenhum teste unitario foi executado."; exit 1; }

  dashboards:
    name: Dashboards do Grafana
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Um dashboard com JSON invalido nao quebra o terraform apply: o
      # ConfigMap e criado do mesmo jeito e o Grafana simplesmente ignora o
      # painel. A falha so apareceria na hora de abrir a interface — que, numa
      # gravacao de demonstracao, e tarde demais.
      - name: Validar JSON e campos obrigatorios
        run: |
          set -euo pipefail
          shopt -s nullglob
          arquivos=(infra/modules/observability/dashboards/*.json)
          if [ ${#arquivos[@]} -eq 0 ]; then
            echo "Nenhum dashboard encontrado."; exit 1
          fi
          for f in "${arquivos[@]}"; do
            jq -e '.uid and .title and (.panels | type == "array" and length > 0)' "$f" > /dev/null \
              || { echo "::error file=$f::JSON invalido ou sem uid/title/panels"; exit 1; }
            # Todo painel precisa apontar para um datasource provisionado pelo
            # modulo; um UID errado gera painel vazio sem mensagem de erro.
            jq -e '[.panels[] | select(.type != "row") | .datasource.uid]
                   | all(. == "mh-prometheus" or . == "mh-loki" or . == "mh-tempo" or . == "mh-cloudwatch")' "$f" > /dev/null \
              || { echo "::error file=$f::painel aponta para datasource fora de mh-prometheus/mh-loki/mh-tempo/mh-cloudwatch"; exit 1; }
            echo "OK $f — $(jq -r '.title' "$f") ($(jq '[.panels[] | select(.type != "row")] | length' "$f") paineis)"
          done